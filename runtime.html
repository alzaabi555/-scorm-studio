<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:13px/1.7 Tahoma;background:#f2f6fa}header{display:flex;gap:7px;align-items:center;padding:9px;flex-wrap:wrap}button,select{padding:8px;border:1px solid #ccd7e3;border-radius:7px;background:white;max-width:250px}iframe{width:100%;height:calc(100vh - 95px);border:0;background:white}#error{color:#a33}</style><header><strong id="title"></strong><select id="pages"></select><button id="prev">السابق</button><button id="next">التالي</button><button id="complete">إنهاء الدرس</button><small id="status"></small><small id="error"></small></header><iframe id="frame" title="صفحة الدرس" allow="fullscreen"></iframe><script src="config.js"></script><script>
(()=>{const $=x=>document.getElementById(x);let api=null,active=false,closed=false,n=0,visited=[],state=null,status='incomplete',start=Date.now();function find(w){for(let i=0;w&&i<100;i++){try{if(w.API)return w.API;if(w.parent===w)break;w=w.parent}catch(e){break}}return null}api=find(window);if(!api)try{api=window.opener?find(window.opener):null}catch(e){}function call(m,...args){if(!api)return '';try{return api[m](...args)}catch(e){$('error').textContent=e.message;return ''}}function set(k,v){if(!active||closed)return false;let ok=String(call('LMSSetValue',k,String(v)))==='true';if(!ok)$('error').textContent='لم تقبل المنصة: '+k;return ok}function time(){let t=Math.floor((Date.now()-start)/1000);return String(Math.floor(t/3600)).padStart(4,'0')+':'+String(Math.floor(t%3600/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function data(s){let d=JSON.stringify({v:visited,s});if(d.length>4096)throw Error('حالة النشاط تتجاوز 4096 حرفًا');return d}function save(){try{let d=data(state);if(!active||closed)return false;set('cmi.suspend_data',d);set('cmi.core.lesson_location',n);set('cmi.core.session_time',time());return String(call('LMSCommit',''))==='true'}catch(e){$('error').textContent=e.message;return false}}function show(){$('status').textContent=(active?'متصل':'غير متصل بمنصة')+' · '+status+' · '+visited.length+'/'+CONFIG.pages.length}function setStatus(s){if(!['completed','passed','failed','incomplete'].includes(s))return false;status=s;let ok=set('cmi.core.lesson_status',s);save();show();return ok}function complete(){return ['passed','failed'].includes(status)?save():setStatus('completed')}if(api){active=String(call('LMSInitialize',''))==='true';if(active){let s=call('LMSGetValue','cmi.core.lesson_status');if(s&&s!=='not attempted')status=s;else set('cmi.core.lesson_status','incomplete');let p=Number(call('LMSGetValue','cmi.core.lesson_location'));if(Number.isInteger(p)&&p>=0&&p<CONFIG.pages.length)n=p;try{let d=JSON.parse(call('LMSGetValue','cmi.suspend_data')||'{}');visited=Array.isArray(d.v)?d.v.filter(x=>Number.isInteger(x)&&x>=0&&x<CONFIG.pages.length):[];state=d.s??null}catch(e){}}}window.SCORMBridge={setScore(v){v=Number(v);if(!Number.isFinite(v)||v<0||v>100)return false;set('cmi.core.score.min',0);set('cmi.core.score.max',100);let ok=set('cmi.core.score.raw',v);save();return ok},complete,setStatus,saveState(s){try{data(s);state=s;return save()}catch(e){$('error').textContent=e.message;return false}},getState:()=>state,save};$('title').textContent=CONFIG.title;CONFIG.pages.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+p;$('pages').append(o)});function go(i){n=Math.max(0,Math.min(CONFIG.pages.length-1,i));$('pages').value=n;$('frame').src='content/'+CONFIG.pages[n].split('/').map(encodeURIComponent).join('/');$('prev').disabled=n===0;$('next').disabled=n===CONFIG.pages.length-1;save();show()}$('pages').onchange=e=>go(Number(e.target.value));$('prev').onclick=()=>go(n-1);$('next').onclick=()=>go(n+1);$('complete').hidden=CONFIG.mode==='api';$('complete').onclick=complete;$('frame').onload=()=>{if(!visited.includes(n))visited.push(n);if(CONFIG.mode==='visited'&&visited.length===CONFIG.pages.length&&status==='incomplete')complete();save();show()};function finish(){if(closed)return;save();set('cmi.core.exit',['completed','passed','failed'].includes(status)?'':'suspend');call('LMSCommit','');if(active)call('LMSFinish','');closed=true}window.addEventListener('pagehide',finish);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});setInterval(save,30000);go(n)})();</script></html>
