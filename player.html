<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة SCORM</title><link rel="stylesheet" href="style.css"><script type="module" src="player.js"></script><body><div class="player"><h2 id="title">مختبر الحزمة</h2><p id="notice" class="muted"></p><div class="tools"><select id="sco" style="width:180px" aria-label="عنصر الدرس"></select><select id="device" style="width:150px" aria-label="حجم العرض"><option value="100%">عرض مرن</option><option value="390px">هاتف</option><option value="768px">لوحي</option><option value="1280px">حاسوب</option></select><button id="restart" class="soft">إعادة التشغيل والاستئناف</button><button id="reset" class="soft">محاولة جديدة</button><button id="full" class="soft">ملء الشاشة</button></div><div class="metrics"><div class="metric">الاتصال<b id="connection">—</b></div><div class="metric">الحالة<b id="status">—</b></div><div class="metric">الدرجة الخام<b id="score">—</b></div><div class="metric">الموضع<b id="location">—</b></div></div><div id="shell"><iframe id="course" title="المحتوى التعليمي" allow="fullscreen"></iframe></div><details open><summary>تقييم العمل</summary><div class="checks" id="checks"></div><label>ملاحظات المراجع<textarea rows="3" id="notes"></textarea></label><div class="tools"><button id="report">تقرير HTML</button><button id="json" class="soft">تقرير JSON</button></div></details><details><summary>بيانات SCORM</summary><table><tbody id="data"></tbody></table></details><details><summary>سجل الاتصال</summary><button id="clear" class="soft">مسح العرض</button><div id="log"></div></details><small>محاكاة تطوير وليست LMS كاملًا. تُحفظ المحاولة في هذا المتصفح. المحتوى يشترك في أصل الموقع؛ استخدم موقعًا مخصصًا ومحتوى موثوقًا فقط.</small></div></body></html>
