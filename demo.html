<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:18px/1.8 Tahoma;padding:25px;background:#fff8ec;color:#2b4056}main{max-width:700px;margin:auto}button{font:inherit;padding:12px 22px;border:0;border-radius:8px;background:#b86931;color:white;margin:6px;cursor:pointer}input{width:100%}#sun{height:100px;width:100px;border-radius:50%;background:#efb638;margin:25px auto;box-shadow:0 0 25px #efb638}</style><main><h1>مختبر الضوء التفاعلي</h1><p>حرّك المؤشر، ثم أجب عن السؤال. تُحفظ حالة النشاط لإعادة تجربتها مع الاستئناف.</p><input id="light" type="range" min="10" max="100" value="50"><div id="sun"></div><h2>أيّ الأجسام مصدر للضوء؟</h2><button id="right">الشمس</button><button id="wrong">القمر</button><p id="result">اختر إجابتك.</p></main><script>const api=parent.SCORMBridge;let state=api?.getState()||{};const light=document.getElementById('light'),sun=document.getElementById('sun'),result=document.getElementById('result');light.value=state.light||50;sun.style.opacity=light.value/100;light.oninput=()=>{sun.style.opacity=light.value/100;state.light=Number(light.value);api?.saveState(state)};function answer(ok){state.answer=ok?'sun':'moon';api?.setScore(ok?100:0);api?.setStatus(ok?'passed':'failed');api?.saveState(state);result.textContent=ok?'إجابة صحيحة. سُجلت الدرجة 100.':'إجابة غير صحيحة؛ أعد المحاولة.'}document.getElementById('right').onclick=()=>answer(true);document.getElementById('wrong').onclick=()=>answer(false);if(state.answer)result.textContent='تمت استعادة الإجابة السابقة: '+(state.answer==='sun'?'الشمس':'القمر');</script></html>
